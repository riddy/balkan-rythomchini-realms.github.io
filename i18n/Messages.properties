CH23.action=Wähle eine Zielkarte zum Duplizieren aus.
CH24.name=Fernglas
CH24.penalty=(*Der Basiswert dieses Gegenstands beträgt -10 in einem Zwei-Spieler-Spiel)
CH25.name=Sarkophag
CH25.bonus=Nimm die oberste Karte des Nachzieh-stapels und lege sie direkt in den Ablage-bereich, danach endet Dein Zug sofort. <br />(Deine Kartenhand bleibt in diesem Zug unverändert.)
CH26.name=Augenbinde
CH26.bonus=Drehe die normale Reihenfolge Deines Zugs um: Lege zuerst eine Karte ab und ziehe danach eine Karte vom Nachziehstapel.
CH27.name=Buch der Prophezeiungen
CH27.bonus=Schau Dir die untersten sieben Karten des Nachziehstapels an. Lege sie danach dorthin zurück.
CH28.name=Kristallkugel
CH28.bonus=Nenne eine Kartenfarbe. Alle Mitspieler müssen ihre Handkarten dieser Farbe zeigen.
CH29.name=Marktwagen
CH29.bonus=Zeige eine Karte aus Deiner Hand. Jeder Mit-spieler kann 3 Karten als Tauschangebot zeigen. Du darfst entscheiden, Deine Karte mit einer angebotenen zu tauschen. Wenn Du kein Angebot annimmst, behalte Deine Karte oder lege sie ab und ziehe eine neue vom Stapel.
CH30.name=Rucksack
CH30.bonus=Ziehe drei verfluchte Gegenstände und lege sie offen zur Seite. Bei den nächsten drei verfluchten Gegenständen, die Du vom Stapel ziehen würdest, musst Du stattdessen jeweils einen dieser drei nehmen.
CH31.name=Schaufel
CH31.bonus=Lege eine Karte aus dem Ablagebereich als unterste Karte in den Nachziehstapel.
CH32.name=Verschlossener Tresor
CH32.bonus=Verdecke zwei Karten im Ablagebereich mit dieser Karte. Sie zählen weiterhin zum Spielende und geben Boni an <span class="undead">Untote</span>, aber niemand, außer Dir, kann sie aufnehmen, zusätzlich sind sie immun gegenüber <span class="cursed-item">Schaufel</span> und <span>Goldener Spiegel</span>.
CH33.name=Kristall Linse
CH33.bonus=Du darfst Dir die oberste Karte des Nachziehstapels ansehen, bevor Du Dich entscheidest, ob Du eine Karte vom Stapel ziehst oder aus dem Ablagebereich nimmst.
CH34.name=Diebische Handschuhe
CH34.bonus=Stiehl einen offenen verfluchten Gegenstand von einem Mitspieler. Du musst ihn sofort benutzen. <br />Der Spieler, den Du bestohlen hast, zieht sofort einen verfluchten Gegenstand vom Stapel nach.
CH35.name=Schrottplatz Karte
CH35.bonus=Nimm einen der oberen drei abgeworfenen verfluchten Gegenstände und benutze ihn sofort.
CH36.name=Geflügelte Stiefel
CH36.bonus=Lege die oberste Karte des Nachziehstapels direkt in den Ablagebereich.
CH37.name=Stab der Transmutation
CH37.bonus=Lege 3-8 Karten aus Deiner Hand als unterste Karten in den Nachziehstapel und ersetze sie mit den obersten Karten des Stapels (gleiche Anzahl).
CH38.name=Harke
CH38.bonus=Ziehe zwei Karten aus dem Ablagebereich, lege danach zwei Karten in den Ablagebereich.
CH39.name=Schatztruhe
CH39.bonus=Die Schatztruhe ist am Spielende +25 Punkte wert, wenn Du mindestens drei weitere verfluchte Gegenstände umgedreht vor Dir liegen hast.
CH40.name=Angelhaken
CH40.bonus=Ziehe zwei Karten vom Nachziehstapel, lege danach zwei Karten in den Ablagebereich.
CH41.name=Reparaturset
CH41.bonus=Kopiere die Fähigkeit eines verfluchten Gegenstands, den Du bereits benutzt hast (mit Ausnahme von <span class="cursed-item">Rucksack</span>, <span class="cursed-item">Sarkophag</span>, <span class="cursed-item">Augenbinde</span> und <span class="cursed-item">Schatztruhe</span>. <br />Schmeiß diese Karte ab und ersetze sie mit einer neuen, wenn Du noch keinen verfluchten Gegenstand benutzt hast.
CH42.name=Sanduhr
CH42.bonus=Mache einen zusätzlichen Zug. Ersetze die Sanduhr mit einem neuen verfluchten Gegenstand erst nach diesem zusätzlichen Zug.
CH43.name=Goldener Spiegel
CH43.bonus=Lege drei Karten aus dem Ablagebereich als unterste Karten in den Nachziehstapel und ersetze sie mit den obersten drei Karten des Stapels.
CH44.name=Hexenkessel
CH44.bonus=Ziehe drei Karten (anstatt einer) vom Nachziehstapel. Dann legst Du zwei davon oben oder unten (oder jeweils eine oben und unten) zurück in den Stapel, bevor Du, nach den normalen Regeln, eine Karte ablegst.
CH45.name=Laterne
CH45.bonus=Wähle eine Farbe. Ziehe solange vom Stapel, bis Du eine Karte dieser Farbe (Joker zählen nicht als diese Farbe) oder insgesamt 10 Karten gezogen hast. <br />Wenn Du eine Karte der Farbe gezogen hast, behalte sie und lege eine andere Karte aus Deiner Hand ab. Zeige die anderen gezogenen Karten und mische sie zurück in den Stapel.
CH46.name=Portal
CH46.bonus=Lege in diesem Zug keine Karte ab. <br />(Ab sofort hast Du eine zusätzliche Karte auf der Hand)
CH47.name=Wunschring
CH47.bonus=Schau Dir die Karten des Nachziehstapels an und lege eine beliebige Karte als oberste auf den Stapel. (Du darfst dies auch direkt bevor Du eine Karte ziehst tun.) <br /> Mische den Stapel am Ende Deines Zugs.
