CH20.bonus=Du darfst am Spielende eine <span class="army">Armee</span>, <span class="leader">Anführer</span>, <span class="wizard">Zauberer</span>, <span class="beast">Bestie</span> oder <span class="undead">Untote</span> aus dem Ablagebereich auf Deine Hand nehmen. <br /><span class="undead">Untote</span> können nicht BLOCKIERT werden.
